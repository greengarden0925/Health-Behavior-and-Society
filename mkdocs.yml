site_name: 健康社會行為學講義
site_description: 公共衛生師國考「健康社會行為學」複習講義（V00–V40）與歷屆國考題（110–115 年）
site_author: 健康社會行為學教學影片計畫
copyright: 講義內容依影片教案整理；國考題與答案來源為考選部公告
repo_url: https://github.com/greengarden0925/Health-Behavior-and-Society
edit_uri: edit/main/docs/
site_url: https://greengarden0925.github.io/Health-Behavior-and-Society/

theme:
  name: material
  language: zh-TW
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

